[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-devops-assistant"
version = "0.2.0"
description = "Local AI DevOps Assistant powered by Qwen3.5-2B and llama.cpp"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["models*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]